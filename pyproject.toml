[project]
name = "inksmcp"
version = "0.1.0"
description = "MCP server that lets AI assistants drive Inkscape"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lxml>=6.1.3",
    "mcp>=2.2.0",
]

[project.scripts]
inksmcp = "inksmcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inksmcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
