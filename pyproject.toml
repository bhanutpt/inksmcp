[project]
name = "inksmcp"
dynamic = ["version"]
description = "MCP server that lets AI assistants create, edit and export vector graphics with Inkscape"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bhanu Prakash Bheemaneni", email = "sbvscp@gmail.com" }]
requires-python = ">=3.12"
keywords = ["mcp", "model-context-protocol", "inkscape", "svg", "vector-graphics", "ai", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Editors :: Vector-Based",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "lxml>=6.1.3",
    "mcp>=2.2.0",
]

[project.urls]
Homepage = "https://github.com/bhanutpt/inksmcp"
Documentation = "https://github.com/bhanutpt/inksmcp/tree/main/docs"
Issues = "https://github.com/bhanutpt/inksmcp/issues"
Changelog = "https://github.com/bhanutpt/inksmcp/blob/main/CHANGELOG.md"

[project.scripts]
inksmcp = "inksmcp.server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/inksmcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/inksmcp"]

[tool.hatch.build.targets.sdist]
include = ["src/inksmcp", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
