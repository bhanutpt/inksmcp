name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Install Inkscape (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y ppa:inkscape.dev/stable
          sudo apt-get update
          # Liberation fonts are metric-compatible with Arial, which several tests measure
          sudo apt-get install -y inkscape fonts-liberation xvfb

      - name: Install Inkscape (Windows)
        if: runner.os == 'Windows'
        run: choco install inkscape -y --no-progress

      - name: Install Inkscape (macOS)
        if: runner.os == 'macOS'
        run: brew install --cask inkscape

      - name: Install dependencies
        run: uv sync --locked

      - name: Inkscape works (open + query, reported as annotations)
        run: uv run python scripts/ci_inkscape_check.py

      - name: Test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run pytest -q -rf --junitxml=junit.xml

      - name: Test
        if: runner.os != 'Linux'
        run: uv run pytest -q -rf --junitxml=junit.xml

      - name: Report failures as annotations
        if: failure()
        run: uv run python scripts/ci_annotate.py junit.xml
